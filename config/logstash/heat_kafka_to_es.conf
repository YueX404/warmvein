# Logstash 供热传感器数据采集配置
# 从 Kafka heat-sensor-topic 读取，写入 Elasticsearch

input {
  kafka {
    bootstrap_servers => "kafka:9093"
    topics => ["heat-sensor-topic"]
    group_id => "logstash_heat_sensor_group"
    consumer_threads => 1
    auto_offset_reset => "earliest"
    codec => json
  }
}

filter {
  # 解析时间戳字段
  date {
    match => [ "event_timestamp", "yyyy-MM-dd HH:mm:ss.SSS" ]
    target => "@timestamp"
  }

  # 提取日期分区字段
  ruby {
    code => '
      ts = event.get("event_timestamp")
      if ts
        event.set("dt", ts[0..9])
        event.set("hour", ts[11..12].to_i)
      end
    '
  }

  # 清理不需要的字段
  mutate {
    remove_field => ["message", "@version", "ts"]
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "heat-sensor-%{+YYYY.MM.dd}"
    document_id => "%{sensor_id}-%{event_timestamp}"
  }

  stdout {
    codec => rubydebug
  }
}
